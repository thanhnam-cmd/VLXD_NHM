<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <!-- White Background -->
  <rect width="960" height="640" fill="#FFFFFF"/>

  <g transform="translate(480, 190)">
    <!-- Golden base curved mound -->
    <path d="M -210,135 Q 0,110 210,135 Q 0,120 -210,135 Z" fill="#D3A237"/>
    <path d="M -225,136 Q 0,105 225,136 C 130,124 -130,124 -225,136 Z" fill="#E2B446"/>

    <!-- Left Navy Swoosh Arc -->
    <path d="M -215,95 C -230,15 -190,-60 -120,-115 C -60,-160 30,-175 105,-155 C 130,-148 145,-138 145,-138 C 145,-138 120,-155 70,-165 C -20,-185 -125,-160 -185,-95 C -235,-40 -245,35 -215,95 Z" fill="#183669"/>
    
    <!-- Right Gold Swoosh Arc -->
    <path d="M -40,-165 C 50,-180 150,-155 205,-95 C 265,-30 250,55 205,115 C 170,160 110,182 60,190 C 85,183 125,168 155,140 C 215,85 235,-5 185,-75 C 140,-130 50,-160 -40,-165 Z" fill="url(#goldGrad)"/>

    <!-- Building Towers in center (Gold) -->
    <!-- Center Left Tower -->
    <polygon points="-85,100 -85,-50 -25,-85 -25,100" fill="#E2B74A"/>
    <!-- Center Right Tower (Darker gold depth) -->
    <polygon points="-25,100 -25,-85 30,-50 30,100" fill="#C59630"/>
    <!-- Side Tower Right -->
    <polygon points="35,100 35,-30 75,-15 75,100" fill="#DBAC3D"/>

    <!-- Navy Blue House Roof in foreground -->
    <polygon points="0,-15 -145,95 -120,105 0,10 120,105 145,95" fill="#183669"/>
    <polygon points="0,-5 -125,90 125,90" fill="#FFFFFF"/>
    <polygon points="0,5 -110,90 110,90" fill="#183669"/>

    <!-- White Window inside house -->
    <g transform="translate(0, 58)">
      <path d="M -16,14 L -16,0 Q -16,-14 0,-14 Q 16,-14 16,0 L 16,14 Z" fill="#FFFFFF"/>
      <!-- Window crossbars -->
      <line x1="-16" y1="2" x2="16" y2="2" stroke="#183669" stroke-width="2.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#183669" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C259"/>
      <stop offset="50%" stop-color="#D3A237"/>
      <stop offset="100%" stop-color="#B88622"/>
    </linearGradient>
  </defs>

  <!-- Typography: NMH in stylized geometric architectural font -->
  <g fill="#183669" transform="translate(480, 430)">
    <!-- N: Pi / Arch style with cutouts -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="180" height="28" rx="2"/>
      <rect x="0" y="28" width="48" height="85" rx="2"/>
      <rect x="132" y="28" width="48" height="85" rx="2"/>
      <!-- Accent small block -->
      <rect x="0" y="75" width="48" height="38" rx="2"/>
    </g>

    <!-- M: Double Arch / Gate style -->
    <g transform="translate(-100, 0)">
      <rect x="0" y="0" width="200" height="28" rx="2"/>
      <rect x="0" y="28" width="44" height="85" rx="2"/>
      <rect x="78" y="28" width="44" height="85" rx="2"/>
      <rect x="156" y="28" width="44" height="85" rx="2"/>
    </g>

    <!-- H: Modern connected bridge -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="46" height="113" rx="2"/>
      <rect x="46" y="44" width="134" height="32" rx="2"/>
      <rect x="134" y="0" width="46" height="113" rx="2"/>
    </g>
  </g>

  <!-- Subtitle: DATA CENTER NETWORK -->
  <text x="480" y="585" 
        text-anchor="middle" 
        font-family="'Be Vietnam Pro', 'Times New Roman', Georgia, serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#183669">
    DATA CENTER NETWORK
  </text>
</svg>
